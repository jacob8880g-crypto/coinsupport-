<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secured-Recovery-protocol</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        nav {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 14px;
        }
        nav a {
            color: gray;
            text-decoration: none;
            margin-left: 15px;
            font-size: 14px;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }
        .badge {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            line-height: 1.2;
            margin: 0 0 20px 0;
        }
        p {
            color: gray;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 14px;
        }
        /* Interactive Button */
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:active {
            transform: scale(0.98);
        }
        
        /* Real Image Styling */
        img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            margin-top: 40px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">SECURED-RECOVERY-PROTOCOL</div>
        <div>
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Support</a>
        </div>
    </nav>
    <main>
        <div class="badge">Trusted Security Platform</div>
        <h1>SECURED-RECOVERY-<br/>PROTOCOL</h1>
        <p>Advanced blockchain wallet recovery and troubleshooting platform. Regain access to your digital assets with enterprise-grade security and professional support.</p>
        
        <!-- Added onclick to make it functional -->
        <button onclick="alert('Troubleshooting started!')">Troubleshoot an Issue</button>
        
        <!-- Replaced placeholder with a real blockchain image from Unsplash -->
        <img src="https://images.unsplash.com/photo-1639762681485-fc7c7207a1b0?auto=format&fit=crop&w=600&q=80" alt="Blockchain Technology">
    </main>
</body>
</html>
