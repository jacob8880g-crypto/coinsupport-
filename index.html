<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secured Recovery Protocol</title>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            color: white; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; }
        
        /* Grid for Wallets */
        .wallet-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
        }
        
        .wallet-card { 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 12px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .wallet-card:hover { 
            border-color: #2563eb; 
            background: #1a1a1a; 
        }
        
        .wallet-icon { 
            width: 48px; 
            height: 48px; 
            background: #333; 
            border-radius: 50%; 
            margin-bottom: 10px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: #aaa;
        }
        
        .wallet-name { 
            font-size: 14px; 
            text-align: center; 
            line-height: 1.3;
        }
        
        /* Issues List */
        .issue-card { 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 15px; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .issue-card:hover { 
            border-color: #2563eb; 
            background: #1a1a1a; 
        }
        .issue-title { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .issue-desc { color: #aaa; font-size: 14px; line-height: 1.4; }
        
        .back-link { 
            display: block; 
            text-align: center; 
            margin-top: 20px; 
            color: #2563eb; 
            text-decoration: none; 
        }

        /* Utility classes */
        .hidden { display: none; }
        .cta-btn { 
            background-color: #2563eb; 
            color: white; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 20px;
        }
        .home-hero { text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <!-- HOME PAGE -->
    <div id="page-home
