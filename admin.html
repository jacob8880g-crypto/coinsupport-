<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Issue Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // --- YOUR FIREBASE CONFIG ---
       const firebaseConfig = {
  apiKey: "AIzaSyC33I7HRwiKo7DtdRsdtdK6OnqDwAquJfI",
  authDomain: "coinsupport-8b036.firebaseapp.com",
  databaseURL: "https://coinsupport-8b036-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "coinsupport-8b036",
  storageBucket: "coinsupport-8b036.firebasestorage.app",
  messagingSenderId: "575774102570",
  appId: "1:575774102570:web:1d0c34b60807dfb2c75f53",
  measurementId: "G-YGCSNX4H9L"
};

        // Initialize Firebase
        let app;
        try {
            app = initializeApp(firebaseConfig);
            console.log("Firebase Initialized");
        } catch (e) {
            alert("Error initializing Firebase: " + e.message);
        }

        const db = getDatabase(app);

        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', () => {
            const tbody = document.getElementById('issue-table-body');
            
            // Reference to issues
            const issuesRef = ref(db, 'issues');

            // Listen for real-time updates
            onValue(issuesRef, (snapshot) => {
                console.log("Data received!"); // Check console to see if this triggers
                const data = snapshot.val();
                
                // Clear table
                tbody.innerHTML = '';

                if (data) {
                    Object.keys(data).forEach((key) => {
                        const issue = data[key];
                        const row = document.createElement('tr');
                        row.className = "border-b border-gray-700 hover:bg-gray-800 transition";
                        
                        row.innerHTML = `
                            <td class="py-3 px-4 text-sm">${new Date(issue.timestamp).toLocaleString()}</td>
                            <td class="py-3 px-4 font-mono text-xs break-all max-w-xs">${issue.walletAddress}</td>
                            <td class="py-3 px-4 text-blue-400 underline cursor-pointer" onclick="window.open('https://explorer.blockchain.com/btc/address/${issue.walletAddress}')">View Explorer</td>
                            <td class="py-3 px-4 text-gray-300 text-sm">${issue.issueType || 'General'}</td>
                            <td class="py-3 px-4 text-gray-400 text-sm max-w-xs truncate" title="${issue.details}">${issue.details || 'No details'}</td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-gray-500">No issues found.</td></tr>';
                }
            }, (error) => {
                alert("Database Error: " + error.message);
            });
        });
    </script>
</head>
<body class="bg-black text-white min-h-screen p-6">
    
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold tracking-wider">ISSUE TRACKER</h1>
            <button onclick="location.reload()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded text-sm">Refresh</button>
        </header>

        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-gray-500 text-sm uppercase border-b border-gray-800">
                        <th class="py-3 px-4">Date/Time</th>
                        <th class="py-3 px-4">Wallet Address</th>
                        <th class="py-3 px-4">Explorer</th>
                        <th class="py-3 px-4">Issue Type</th>
                        <th class="py-3 px-4">Details</th>
                    </tr>
                </thead>
                <tbody id="issue-table-body" class="text-sm">
                    <tr><td colspan="5" class="py-4 text-center text-gray-500">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
